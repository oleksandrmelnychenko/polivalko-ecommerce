x-required-env: &required-env
  Site__PublicUrl: ${SITE_URL:?Задайте SITE_URL — публічна адреса з https://}
  Web__RevalidateSecret: ${REVALIDATE_SECRET:?Задайте REVALIDATE_SECRET — випадковий рядок}
  Payments__Provider: ${PAYMENTS_PROVIDER:?Задайте PAYMENTS_PROVIDER — Sandbox або Mono}
  Payments__Sandbox__Secret: ${PAYMENTS_SANDBOX_SECRET:?Задайте PAYMENTS_SANDBOX_SECRET — випадковий рядок}
  Fiscal__Provider: ${FISCAL_PROVIDER:?Задайте FISCAL_PROVIDER — Disabled, Stub або Checkbox}

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD — надійний пароль БД}
    ports: !reset []

  api:
    environment:
      <<: *required-env
      Database__SeedDemoData: ${SEED_DEMO_DATA:-false}
      Api__ExposeDocs: ${EXPOSE_API_DOCS:-false}

  worker:
    environment:
      <<: *required-env

  web:
    environment:
      SITE_URL: ${SITE_URL:?Задайте SITE_URL — публічна адреса з https://}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?Задайте REVALIDATE_SECRET — випадковий рядок}

  console:
    environment:
      SITE_URL: ${SITE_URL:?Задайте SITE_URL — публічна адреса з https://}

  caddy:
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Задайте SITE_ADDRESS — домен магазину, напр. example.ua}
      CONSOLE_ADDRESS: ${CONSOLE_ADDRESS:?Задайте CONSOLE_ADDRESS — домен консолі, напр. console.example.ua}
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"

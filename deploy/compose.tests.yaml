# Isolated Linux backend tests; no host keychain, runtime secrets or application database mounts.
services:
  database:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: polivalko_tests
      POSTGRES_USER: polivalko_test
      POSTGRES_PASSWORD: isolated-test-only
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polivalko_test -d polivalko_tests"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    image: mcr.microsoft.com/dotnet/sdk:10.0.403
    cpus: 2
    mem_limit: 4g
    working_dir: /work
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      POLIVALKO_TEST_DATABASE: Host=database;Port=5432;Database=polivalko_tests;Username=polivalko_test;Password=isolated-test-only
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ../src:/source/src:ro
      - ../tests:/source/tests:ro
      - ../Directory.Build.props:/source/Directory.Build.props:ro
      - ../Directory.Packages.props:/source/Directory.Packages.props:ro
      - ../PoliValko.slnx:/source/PoliValko.slnx:ro
      - ../global.json:/source/global.json:ro
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /work/openapi
        tar -C /source --exclude=bin --exclude=obj -cf - . | tar -C /work -xf -
        dotnet restore PoliValko.slnx
        dotnet build PoliValko.slnx --no-restore -c Release -m:2
        dotnet test --solution PoliValko.slnx --no-build -c Release

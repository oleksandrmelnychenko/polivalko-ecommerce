name: polivalko

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-db-connection: &db Host=postgres;Port=5432;Database=polivalko;Username=polivalko;Password=${POSTGRES_PASSWORD:-polivalko_dev};GSS Encryption Mode=Disable

x-app-env: &app-env
  ConnectionStrings__PoliValko: *db
  Site__PublicUrl: ${SITE_URL:-http://localhost:8080}
  Web__RevalidateUrl: http://web:3000/internal/revalidate
  Web__RevalidateSecret: ${REVALIDATE_SECRET:-local-revalidate-secret}
  Navkolo__Mode: ${NAVKOLO_MODE:-Stub}
  Navkolo__SyncInterval: ${NAVKOLO_SYNC_INTERVAL:-00:05:00}
  Payments__Provider: ${PAYMENTS_PROVIDER:-Sandbox}
  Payments__Sandbox__Secret: ${PAYMENTS_SANDBOX_SECRET:-local-sandbox-secret}
  Payments__Mono__Token: ${MONO_TOKEN:-}
  Fiscal__Provider: ${FISCAL_PROVIDER:-Stub}
  Fiscal__Checkbox__LicenseKey: ${CHECKBOX_LICENSE_KEY:-}
  Fiscal__Checkbox__CashierLogin: ${CHECKBOX_CASHIER_LOGIN:-}
  Fiscal__Checkbox__CashierPassword: ${CHECKBOX_CASHIER_PASSWORD:-}
  Delivery__NovaPoshta__ApiKey: ${NOVAPOSHTA_API_KEY:-}
  Seller__Name: ${SELLER_NAME:-Продавець уточнюється}
  Seller__TaxId: ${SELLER_TAX_ID:-}
  Seller__Address: ${SELLER_ADDRESS:-}
  Notifications__Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
  Notifications__Telegram__ChatId: ${TELEGRAM_CHAT_ID:-}

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: polivalko
      POSTGRES_USER: polivalko
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polivalko_dev}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polivalko -d polivalko"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  migrate:
    profiles: [app]
    image: polivalko-migrate:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: deploy/dotnet.Dockerfile
      target: migrate
    environment:
      ConnectionStrings__PoliValko: *db
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  api:
    profiles: [app]
    image: polivalko-api:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: deploy/dotnet.Dockerfile
      target: api
    restart: unless-stopped
    environment:
      <<: *app-env
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Production}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Database__SeedDemoData: ${SEED_DEMO_DATA:-true}
      Api__ExposeDocs: ${EXPOSE_API_DOCS:-true}
      Media__Root: /data/media
      Seed__Users__0__Email: ${ADMIN_EMAIL:-}
      Seed__Users__0__Password: ${ADMIN_PASSWORD:-}
      Seed__Users__0__DisplayName: Адміністратор
      Seed__Users__0__Role: Admin
    volumes:
      - media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *logging

  worker:
    profiles: [app]
    image: polivalko-worker:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: deploy/dotnet.Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      <<: *app-env
      DOTNET_ENVIRONMENT: ${APP_ENVIRONMENT:-Production}
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *logging

  web:
    profiles: [app]
    image: polivalko-web:${APP_VERSION:-latest}
    build:
      context: web
      args:
        SITE_URL: ${SITE_URL:-http://localhost:8080}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_GSC_VERIFICATION: ${GSC_VERIFICATION:-}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8080
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-local-revalidate-secret}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    depends_on:
      - api
    logging: *logging

  caddy:
    profiles: [app]
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
      SEARCH_INDEXING: ${SEARCH_INDEXING:-index}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - web
      - api
    logging: *logging

  backup:
    profiles: [app]
    image: postgres:18
    command: ["bash", "/opt/backup/backup.sh", "schedule"]
    init: true
    restart: unless-stopped
    environment:
      TZ: Europe/Kyiv
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: polivalko
      PGUSER: polivalko
      PGPASSWORD: ${POSTGRES_PASSWORD:-polivalko_dev}
      PGGSSENCMODE: disable
      BACKUP_DIR: /backups
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./deploy/backup:/opt/backup:ro
      - ${BACKUP_PATH:-backups}:/backups
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "bash", "/opt/backup/backup.sh", "check"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 15m
      start_interval: 30s
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  backup-offsite:
    profiles: [offsite]
    image: rclone/rclone:1.71
    entrypoint: ["sh", "/opt/backup/offsite.sh"]
    init: true
    restart: unless-stopped
    environment:
      BACKUP_DIR: /backups
      MEDIA_DIR: /media
      OFFSITE_TARGET: ${OFFSITE_TARGET:-}
      OFFSITE_INTERVAL: ${OFFSITE_INTERVAL:-3600}
      OFFSITE_RETENTION_DAYS: ${OFFSITE_RETENTION_DAYS:-}
      RCLONE_CONFIG: /dev/null
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${OFFSITE_S3_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${OFFSITE_S3_REGION:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${OFFSITE_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${OFFSITE_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "true"
    volumes:
      - ./deploy/backup:/opt/backup:ro
      - ${BACKUP_PATH:-backups}:/backups:ro
      - media:/media:ro
    healthcheck:
      test: ["CMD", "sh", "/opt/backup/offsite.sh", "check"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 10m
      start_interval: 30s
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  media:
  backups:

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: API, Worker, тести
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: dotnet restore PoliValko.slnx
      - run: dotnet build PoliValko.slnx --no-restore -c Release

      - name: Контракт OpenAPI закомічено
        run: git diff --exit-code -- openapi/

      - name: Тести та запуск сервісу товарної аналітики
        run: |
          docker build -t polivalko-product-analytics:ci services/product-analytics
          docker run --rm --network none -v "$PWD/services/product-analytics/tests:/app/tests:ro" \
            polivalko-product-analytics:ci python -m unittest discover -s tests -v
          docker run -d --name polivalko-product-analytics -p 127.0.0.1:18082:8080 polivalko-product-analytics:ci
          curl -fsS --retry 20 --retry-all-errors --retry-delay 1 --max-time 2 http://127.0.0.1:18082/health/live

      - name: Виробнича бізнес-аналітика · перевірка без БД
        run: |
          docker build -t business-analytics:ci services/business-analytics
          docker run --rm --network none -v "$PWD/services/business-analytics/tests:/app/tests:ro" business-analytics:ci python -m unittest discover -s tests -v

      - run: dotnet test --solution PoliValko.slnx --no-build -c Release
        env:
          ProductAnalytics__BaseUrl: http://127.0.0.1:18082

  web:
    name: Вітрина й консоль (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm audit --omit=dev
      - name: TS-типи відповідають контракту OpenAPI
        run: npm run api:types && git diff --exit-code -- packages/shared/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: node --test apps/shop/tests/*.test.mjs
      - run: npm run build

  deploy:
    name: Розгортання (compose, образи, скрипти)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Скрипти бекапів (синтаксис і shellcheck)
        run: |
          for f in deploy/backup/*.sh; do
            case "$(head -n 1 "$f")" in
              *bash*) bash -n "$f" ;;
              *) sh -n "$f" ;;
            esac
          done
          shellcheck --severity=warning deploy/backup/*.sh
          if grep -l $'\r' deploy/backup/*.sh deploy/Caddyfile; then
            echo "::error::Скрипти й Caddyfile мають бути з LF-закінченнями рядків"
            exit 1
          fi

      - name: Конфігурація compose (локально і staging)
        run: |
          sh -n deploy/test-backend.sh
          docker compose -f deploy/compose.tests.yaml config -q
          docker compose --profile app --profile offsite config -q
          docker compose -f compose.yaml -f compose.staging.yaml --profile app config -q

      - name: Конфігурація compose (production)
        env:
          DATA_PROTECTION_CERTIFICATE_DIR: /tmp/polivalko-ci-keys
          POSTGRES_PASSWORD: ci-only
          SITE_ADDRESS: shop.example.ua
          SITE_URL: https://shop.example.ua
          CONSOLE_ADDRESS: console.shop.example.ua
          CONSOLE_ALLOWED_IPS: 203.0.113.0/24
          REVALIDATE_SECRET: ci-only
          PAYMENTS_PROVIDER: Mono
          FISCAL_PROVIDER: Stub
        run: docker compose -f compose.yaml -f deploy/compose.production.yaml --profile app --profile offsite config -q

      - name: Caddyfile
        run: |
          for indexing in index noindex; do
            docker run --rm -e SEARCH_INDEXING=$indexing -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
              caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done
          docker run --rm -e SITE_ADDRESS=shop.example.ua -e CONSOLE_ADDRESS=console.shop.example.ua -e CONSOLE_ALLOWED_IPS=203.0.113.0/24 \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Сценарій навантажувального тесту (k6 inspect)
        run: docker run --rm -v "$PWD/tests/load:/scripts:ro" grafana/k6:1.3.0 inspect /scripts/storefront.js > /dev/null

      - name: Збірка образів
        run: docker compose --profile app build

  production:
    needs: [backend, web, deploy]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == 'oleksandrmelnychenko/polivalko-ecommerce'
    uses: ./.github/workflows/sync-production.yml
    permissions:
      contents: read
      deployments: write
    secrets:
      POLIVALKO_PUSH_KEY: ${{ secrets.POLIVALKO_PUSH_KEY }}

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: API, Worker, тести
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: dotnet restore PoliValko.slnx
      - run: dotnet build PoliValko.slnx --no-restore -c Release

      - name: Контракт OpenAPI закомічено
        run: git diff --exit-code -- openapi/

      - run: dotnet test --solution PoliValko.slnx --no-build -c Release

  web:
    name: Вітрина й консоль (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: TS-типи відповідають контракту OpenAPI
        run: npm run api:types && git diff --exit-code -- packages/shared/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  deploy:
    name: Розгортання (compose, образи, скрипти)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Скрипти бекапів (синтаксис і shellcheck)
        run: |
          for f in deploy/backup/*.sh; do
            case "$(head -n 1 "$f")" in
              *bash*) bash -n "$f" ;;
              *) sh -n "$f" ;;
            esac
          done
          shellcheck --severity=warning deploy/backup/*.sh
          if grep -l $'\r' deploy/backup/*.sh deploy/Caddyfile; then
            echo "::error::Скрипти й Caddyfile мають бути з LF-закінченнями рядків"
            exit 1
          fi

      - name: Конфігурація compose (локально і staging)
        run: |
          docker compose --profile app --profile offsite config -q
          docker compose -f compose.yaml -f compose.staging.yaml --profile app config -q

      - name: Конфігурація compose (production)
        env:
          POSTGRES_PASSWORD: ci-only
          SITE_ADDRESS: shop.example.ua
          SITE_URL: https://shop.example.ua
          CONSOLE_ADDRESS: console.shop.example.ua
          REVALIDATE_SECRET: ci-only
          PAYMENTS_PROVIDER: Sandbox
          PAYMENTS_SANDBOX_SECRET: ci-only
          FISCAL_PROVIDER: Stub
        run: docker compose -f compose.yaml -f deploy/compose.production.yaml --profile app --profile offsite config -q

      - name: Caddyfile
        run: |
          for indexing in index noindex; do
            docker run --rm -e SEARCH_INDEXING=$indexing -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
              caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done
          docker run --rm -e SITE_ADDRESS=shop.example.ua -e CONSOLE_ADDRESS=console.shop.example.ua -e CONSOLE_ALLOWED_IPS=203.0.113.0/24 \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Сценарій навантажувального тесту (k6 inspect)
        run: docker run --rm -v "$PWD/tests/load:/scripts:ro" grafana/k6:1.3.0 inspect /scripts/storefront.js > /dev/null

      - name: Збірка образів
        run: docker compose --profile app build
